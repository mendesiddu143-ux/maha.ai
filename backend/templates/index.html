<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Maha.ai — Cosmic AI Experience</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%; overflow:hidden;
    background:#000; color:#fff;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    cursor: default;
  }
  canvas { display:block; position:fixed; top:0; left:0; z-index:1; }

  /* ---------- LOGIN OVERLAY ---------- */
  #login {
    position:fixed; inset:0; z-index:10;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    background: radial-gradient(ellipse at center, rgba(10,5,40,0.25) 0%, rgba(0,0,0,0.65) 100%);
    transition: opacity 1.8s ease;
  }
  #login.hidden { opacity:0; pointer-events:none; }

  .logo {
    font-size: 64px;
    font-weight: 200;
    letter-spacing: 14px;
    background: linear-gradient(90deg, #6ad6ff, #b388ff, #6ad6ff);
    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: shimmer 6s linear infinite;
    text-shadow: 0 0 40px rgba(120,150,255,0.3);
    margin-bottom: 8px;
  }
  .logo span { font-weight: 600; letter-spacing: 6px; }
  @keyframes shimmer { to { background-position: 200% center; } }

  .tagline {
    font-size: 13px; letter-spacing: 6px; text-transform: uppercase;
    color: rgba(180,200,255,0.55); margin-bottom: 60px;
  }

  .input-wrap { position:relative; margin-bottom:36px; }
  #nameInput {
    width: 360px; padding: 18px 24px;
    background: rgba(10,20,50,0.35);
    border: 1px solid rgba(140,170,255,0.25);
    border-radius: 50px;
    color:#fff; font-size:16px; letter-spacing:3px;
    text-align:center; outline:none;
    backdrop-filter: blur(12px);
    transition: all 0.4s ease;
  }
  #nameInput:focus {
    border-color: rgba(180,140,255,0.7);
    box-shadow: 0 0 30px rgba(140,100,255,0.4), inset 0 0 20px rgba(100,150,255,0.1);
  }
  #nameInput::placeholder { color: rgba(180,200,255,0.4); letter-spacing:4px; }

  #connectBtn {
    position:relative;
    padding: 20px 64px;
    background: linear-gradient(135deg, rgba(80,40,180,0.4), rgba(40,90,200,0.4));
    border: 1px solid rgba(180,150,255,0.5);
    border-radius: 50px;
    color:#fff; font-size:15px; letter-spacing:8px; text-transform:uppercase;
    font-weight:500; cursor:pointer;
    backdrop-filter: blur(12px);
    transition: all 0.4s ease;
    overflow:hidden;
  }
  #connectBtn::before {
    content:''; position:absolute; inset:-2px;
    background: conic-gradient(from 0deg, transparent, #b388ff, #6ad6ff, transparent);
    border-radius:50px; z-index:-1;
    animation: rotate 4s linear infinite;
    opacity: 0.7;
  }
  #connectBtn::after {
    content:''; position:absolute; inset:1px;
    background: linear-gradient(135deg, rgba(20,10,60,0.95), rgba(10,30,80,0.95));
    border-radius:50px; z-index:-1;
  }
  @keyframes rotate { to { transform: rotate(360deg); } }
  #connectBtn:hover {
    transform: scale(1.05);
    box-shadow: 0 0 60px rgba(140,100,255,0.6);
  }
  #connectBtn:disabled { opacity:0.5; cursor:not-allowed; transform:none; }

  /* ---------- JOURNEY HUD ---------- */
  #hud {
    position:fixed; inset:0; z-index:5;
    pointer-events:none; opacity:0;
    transition: opacity 1s ease;
  }
  #hud.active { opacity:1; }

  .stage-label {
    position:absolute; bottom:8%; left:50%;
    transform:translateX(-50%);
    font-size:11px; letter-spacing:10px;
    text-transform:uppercase;
    color: rgba(180,210,255,0.8);
    text-shadow: 0 0 20px rgba(120,160,255,0.7);
    text-align:center;
  }
  .stage-label .sub {
    display:block; margin-top:8px;
    font-size:9px; letter-spacing:6px;
    color: rgba(180,210,255,0.4);
  }

  .corner {
    position:absolute; font-size:10px; letter-spacing:4px;
    color: rgba(150,200,255,0.6); text-transform:uppercase;
  }
  .corner.tl { top:30px; left:30px; }
  .corner.tr { top:30px; right:30px; text-align:right; }
  .corner.bl { bottom:30px; left:30px; }

  .scan-line {
    position:absolute; left:0; right:0; height:1px;
    background: linear-gradient(90deg, transparent, rgba(120,180,255,0.4), transparent);
    animation: scan 8s linear infinite;
  }
  @keyframes scan {
    0%{top:0;} 100%{top:100%;}
  }

  /* ---------- AI INTERFACE ---------- */
  #aiUI {
    position:fixed; inset:0; z-index:6;
    pointer-events:none; opacity:0;
    transition: opacity 2s ease;
    display:flex; flex-direction:column;
    align-items:center; justify-content:flex-end;
    padding-bottom: 8%;
  }
  #aiUI.active { opacity:1; pointer-events:auto; }

  .ai-greeting {
    font-size: 28px; font-weight:200; letter-spacing:4px;
    color:#fff; text-shadow: 0 0 30px rgba(180,140,255,0.8);
    margin-bottom: 16px; text-align:center;
    min-height: 40px;
    opacity:0; transition: opacity 1.5s ease;
  }
  .ai-greeting.show { opacity:1; }

  .ai-status {
    font-size:11px; letter-spacing:6px; text-transform:uppercase;
    color: rgba(180,210,255,0.6); margin-bottom: 40px;
  }
  .ai-status .dot {
    display:inline-block; width:8px; height:8px; border-radius:50%;
    background:#6ad6ff; margin-right:10px;
    box-shadow: 0 0 12px #6ad6ff;
    animation: pulse 1.5s ease-in-out infinite;
  }
  @keyframes pulse { 50%{ opacity:0.3; transform:scale(1.4);} }

  .mic-btn {
    width:80px; height:80px; border-radius:50%;
    background: linear-gradient(135deg, rgba(140,80,255,0.3), rgba(60,120,255,0.3));
    border: 2px solid rgba(180,140,255,0.6);
    cursor:pointer; display:flex; align-items:center; justify-content:center;
    backdrop-filter: blur(8px);
    transition: all 0.3s ease;
    box-shadow: 0 0 40px rgba(140,100,255,0.4);
  }
  .mic-btn:hover { transform:scale(1.1); box-shadow: 0 0 60px rgba(140,100,255,0.8); }
  .mic-btn.listening { animation: micPulse 1.2s ease-in-out infinite; background: linear-gradient(135deg, rgba(255,80,140,0.4), rgba(180,60,200,0.4));}
  @keyframes micPulse { 50%{ box-shadow: 0 0 80px rgba(255,100,180,0.9);} }
  .mic-btn svg { width:32px; height:32px; fill:#fff; }

  .transcript {
    margin-top: 24px; min-height:24px;
    font-size:13px; letter-spacing:2px;
    color: rgba(200,220,255,0.7);
    max-width: 600px; text-align:center;
  }

  /* ---------- STAR / LOAD ---------- */
  #loader {
    position:fixed; inset:0; z-index:20;
    display:flex; align-items:center; justify-content:center;
    background:#000; transition: opacity 1.5s ease;
  }
  #loader.hidden { opacity:0; pointer-events:none; }
  .loader-text {
    font-size:11px; letter-spacing:8px; color: rgba(180,210,255,0.6);
    text-transform:uppercase;
  }

  .warp-flash {
    position:fixed; inset:0; z-index:4;
    background: radial-gradient(ellipse at center, rgba(255,255,255,0.9), transparent 60%);
    opacity:0; pointer-events:none;
    transition: opacity 0.6s ease;
  }
  .warp-flash.active { opacity:1; }
</style>
</head>
<body>

<div id="loader"><div class="loader-text">Initializing Cosmos...</div></div>

<!-- LOGIN -->
<div id="login">
  <div class="logo">MAHA<span>.AI</span></div>
  <div class="tagline">Cosmic Intelligence · Voice Interface</div>
  <div class="input-wrap">
    <input id="nameInput" type="text" placeholder="ENTER YOUR NAME" maxlength="20" autocomplete="off"/>
  </div>
  <button id="connectBtn">Connect</button>
</div>

<!-- JOURNEY HUD -->
<div id="hud">
  <div class="scan-line"></div>
  <div class="corner tl">MAHA.AI<br/>v 1.0 · COSMIC LINK</div>
  <div class="corner tr" id="hudCoords">SECTOR · LOADING<br/>VEL · 0 c</div>
  <div class="corner bl" id="hudSignal">SIGNAL · SEARCHING</div>
  <div class="stage-label" id="stageLabel">
    INITIATING JOURNEY
    <span class="sub">Stand by</span>
  </div>
</div>

<div class="warp-flash" id="warpFlash"></div>

<!-- AI INTERFACE -->
<div id="aiUI">
  <div class="ai-greeting" id="greeting"></div>
  <div class="ai-status"><span class="dot"></span> Maha.ai · Connected</div>
  <button class="mic-btn" id="micBtn" title="Speak to Maha">
    <svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>
  </button>
  <div class="transcript" id="transcript"></div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

/* =========================================================
   MAHA.AI — Cosmic Voice AI Experience
   ========================================================= */

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.1, 200000);
const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ---------- UTILITIES ---------- */
const TAU = Math.PI*2;
const rand = (a,b)=> a + Math.random()*(b-a);

/* ---------- STAR FIELD (billions feel) ---------- */
function createStarfield(count, radius, sizeRange=[0.5,2.5]) {
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(count*3);
  const col = new Float32Array(count*3);
  const siz = new Float32Array(count);
  for (let i=0;i<count;i++){
    // spherical distribution
    const u = Math.random(), v = Math.random();
    const theta = TAU*u, phi = Math.acos(2*v-1);
    const r = radius * (0.6 + Math.random()*0.4);
    pos[i*3]   = r*Math.sin(phi)*Math.cos(theta);
    pos[i*3+1] = r*Math.sin(phi)*Math.sin(theta);
    pos[i*3+2] = r*Math.cos(phi);
    // color: white -> blue -> yellow tinted
    const t = Math.random();
    if (t<0.7){ col[i*3]=1; col[i*3+1]=1; col[i*3+2]=1; }
    else if (t<0.85){ col[i*3]=0.7; col[i*3+1]=0.85; col[i*3+2]=1.0; }
    else { col[i*3]=1.0; col[i*3+1]=0.9; col[i*3+2]=0.75; }
    siz[i] = rand(sizeRange[0], sizeRange[1]);
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
  geo.setAttribute('color',    new THREE.BufferAttribute(col,3));
  geo.setAttribute('size',     new THREE.BufferAttribute(siz,1));

  const mat = new THREE.ShaderMaterial({
    uniforms: { uTime:{value:0} },
    transparent:true, depthWrite:false,
    blending: THREE.AdditiveBlending,
    vertexShader:`
      attribute float size;
      varying vec3 vColor;
      uniform float uTime;
      void main(){
        vColor = color;
        vec4 mv = modelViewMatrix * vec4(position,1.0);
        float tw = 0.7 + 0.3*sin(uTime*2.0 + position.x*0.01 + position.y*0.01);
        gl_PointSize = size * tw * (300.0 / -mv.z);
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader:`
      varying vec3 vColor;
      void main(){
        vec2 c = gl_PointCoord - 0.5;
        float d = length(c);
        float a = smoothstep(0.5, 0.0, d);
        a = pow(a, 2.0);
        gl_FragColor = vec4(vColor, a);
      }`,
    vertexColors:true
  });
  return new THREE.Points(geo, mat);
}

const nearStars = createStarfield(8000, 5000, [1,3]);
const farStars  = createStarfield(15000, 30000, [0.5,2]);
const deepStars = createStarfield(20000, 90000, [0.3,1.5]);
scene.add(nearStars, farStars, deepStars);

/* ---------- NEBULA CLOUDS ---------- */
function makeNebulaTexture(hueA, hueB){
  const c = document.createElement('canvas'); c.width=c.height=512;
  const x = c.getContext('2d');
  const g = x.createRadialGradient(256,256,20, 256,256,256);
  g.addColorStop(0, `hsla(${hueA},90%,70%,0.9)`);
  g.addColorStop(0.4,`hsla(${hueB},80%,55%,0.45)`);
  g.addColorStop(1, 'hsla(260,80%,10%,0)');
  x.fillStyle=g; x.fillRect(0,0,512,512);
  // sprinkle stars / detail
  for (let i=0;i<200;i++){
    x.fillStyle=`rgba(255,255,255,${Math.random()*0.4})`;
    x.fillRect(Math.random()*512, Math.random()*512, 1, 1);
  }
  return new THREE.CanvasTexture(c);
}
const nebulaTex1 = makeNebulaTexture(270, 220);
const nebulaTex2 = makeNebulaTexture(200, 300);
const nebulaTex3 = makeNebulaTexture(320, 260);

function addNebula(tex, pos, scale, color){
  const m = new THREE.SpriteMaterial({ map:tex, transparent:true, opacity:0.6,
    blending:THREE.AdditiveBlending, depthWrite:false, color });
  const s = new THREE.Sprite(m);
  s.position.copy(pos); s.scale.set(scale,scale,scale);
  scene.add(s); return s;
}
const nebulas = [
  addNebula(nebulaTex1, new THREE.Vector3(-8000,2000,-15000), 18000, 0xb388ff),
  addNebula(nebulaTex2, new THREE.Vector3(12000,-3000,-22000), 22000, 0x6ad6ff),
  addNebula(nebulaTex3, new THREE.Vector3(-15000,-5000,-30000), 25000, 0xff6ad6),
  addNebula(nebulaTex1, new THREE.Vector3(20000,8000,-45000), 30000, 0x88b3ff),
];

/* ---------- LIGHTING ---------- */
const sun = new THREE.DirectionalLight(0xffffff, 2.5);
sun.position.set(1,0.3,1).normalize();
scene.add(sun);
scene.add(new THREE.AmbientLight(0x223355, 0.4));

const sunLight2 = new THREE.PointLight(0xfff0c0, 3, 50000);
sunLight2.position.set(2000,500,2000);
scene.add(sunLight2);

/* ---------- PROCEDURAL PLANET FACTORY ---------- */
function makePlanetTexture({base, bands=[], spots=0, noise=true}) {
  const c=document.createElement('canvas'); c.width=1024; c.height=512;
  const x=c.getContext('2d');
  // base gradient
  const g = x.createLinearGradient(0,0,0,512);
  base.forEach((stop,i)=> g.addColorStop(i/(base.length-1), stop));
  x.fillStyle=g; x.fillRect(0,0,1024,512);
  // bands
  bands.forEach(b=>{
    x.fillStyle=b.color;
    x.globalAlpha=b.alpha||0.4;
    for (let y=b.y; y<b.y+b.h; y++){
      const w = b.wave ? Math.sin(y*0.1)*b.wave : 0;
      x.fillRect(0, y, 1024, 1);
    }
    x.globalAlpha=1;
  });
  // spots
  for (let i=0;i<spots;i++){
    const px=Math.random()*1024, py=Math.random()*512;
    const r=20+Math.random()*60;
    const grd=x.createRadialGradient(px,py,1,px,py,r);
    grd.addColorStop(0,'rgba(255,200,150,0.6)');
    grd.addColorStop(1,'rgba(255,200,150,0)');
    x.fillStyle=grd; x.beginPath(); x.arc(px,py,r,0,TAU); x.fill();
  }
  // noise
  if (noise){
    const id = x.getImageData(0,0,1024,512);
    for (let i=0;i<id.data.length;i+=4){
      const n=(Math.random()-0.5)*30;
      id.data[i]   = Math.max(0,Math.min(255,id.data[i]+n));
      id.data[i+1] = Math.max(0,Math.min(255,id.data[i+1]+n));
      id.data[i+2] = Math.max(0,Math.min(255,id.data[i+2]+n));
    }
    x.putImageData(id,0,0);
  }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

function makeEarth() {
  const c=document.createElement('canvas'); c.width=1024; c.height=512;
  const x=c.getContext('2d');
  // ocean
  const g=x.createLinearGradient(0,0,0,512);
  g.addColorStop(0,'#0a3a6b'); g.addColorStop(0.5,'#1a5fa0'); g.addColorStop(1,'#0a3a6b');
  x.fillStyle=g; x.fillRect(0,0,1024,512);
  // continents (random blobs)
  x.fillStyle='#2d5a2a';
  for (let i=0;i<25;i++){
    const px=Math.random()*1024, py=80+Math.random()*350;
    x.beginPath();
    for (let a=0;a<TAU;a+=0.3){
      const r=30+Math.random()*80;
      const xx=px+Math.cos(a)*r*(0.5+Math.random()*0.5);
      const yy=py+Math.sin(a)*r*(0.5+Math.random()*0.5);
      a===0?x.moveTo(xx,yy):x.lineTo(xx,yy);
    }
    x.closePath(); x.fill();
  }
  // ice caps
  x.fillStyle='rgba(255,255,255,0.85)';
  x.fillRect(0,0,1024,40); x.fillRect(0,472,1024,40);
  // clouds overlay
  x.fillStyle='rgba(255,255,255,0.3)';
  for (let i=0;i<60;i++){
    x.beginPath();
    x.arc(Math.random()*1024, Math.random()*512, 10+Math.random()*40,0,TAU);
    x.fill();
  }
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; return t;
}

/* ---------- CELESTIAL BODIES ---------- */
const bodies = {};

// EARTH
{
  const tex = makeEarth();
  const geo = new THREE.SphereGeometry(80, 64, 64);
  const mat = new THREE.MeshStandardMaterial({ map:tex, roughness:0.85, metalness:0.05 });
  bodies.earth = new THREE.Mesh(geo, mat);
  bodies.earth.position.set(0, 0, -200);
  scene.add(bodies.earth);
  // atmosphere glow
  const atmGeo = new THREE.SphereGeometry(88, 64, 64);
  const atmMat = new THREE.ShaderMaterial({
    transparent:true, blending:THREE.AdditiveBlending, side:THREE.BackSide,
    uniforms:{ uColor:{value:new THREE.Color(0x4a9eff)} },
    vertexShader:`varying vec3 vN; void main(){ vN=normalize(normalMatrix*normal); gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
    fragmentShader:`varying vec3 vN; uniform vec3 uColor; void main(){ float i=pow(0.75-dot(vN,vec3(0.,0.,1.)),3.); gl_FragColor=vec4(uColor,1.)*i; }`
  });
  const atm = new THREE.Mesh(atmGeo, atmMat);
  bodies.earth.add(atm);
}

// JUPITER (bands)
{
  const tex = makePlanetTexture({
    base:['#c9a07a','#e8c79a','#b8855a','#d9a878','#a87248'],
    bands:[
      {y:120,h:30,color:'#8a5530',alpha:0.5},
      {y:200,h:25,color:'#e8d4a0',alpha:0.4},
      {y:280,h:40,color:'#6b4020',alpha:0.55},
      {y:360,h:20,color:'#d4a070',alpha:0.4},
    ],
    spots:8
  });
  const g = new THREE.SphereGeometry(400, 64, 64);
  bodies.jupiter = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ map:tex, roughness:0.95 }));
  bodies.jupiter.position.set(-1200, -200, -3000);
  scene.add(bodies.jupiter);
}

// SATURN with rings
{
  const tex = makePlanetTexture({
    base:['#d4b886','#e8d4a0','#c9a878','#b89060','#a87850'],
    bands:[
      {y:150,h:20,color:'#b08850',alpha:0.4},
      {y:260,h:30,color:'#e8d8a8',alpha:0.35},
      {y:340,h:15,color:'#8a6038',alpha:0.45},
    ]
  });
  const g = new THREE.SphereGeometry(350, 64, 64);
  bodies.saturn = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ map:tex, roughness:0.92 }));
  bodies.saturn.position.set(1500, 300, -6500);
  bodies.saturn.rotation.z = 0.4;
  scene.add(bodies.saturn);
  // rings
  const ringGeo = new THREE.RingGeometry(450, 750, 128);
  const ringTex = (() => {
    const c=document.createElement('canvas'); c.width=512; c.height=64;
    const x=c.getContext('2d');
    for (let i=0;i<512;i++){
      const a = 0.3 + Math.random()*0.7;
      const b = 0.6 + Math.sin(i*0.05)*0.3 + Math.random()*0.15;
      x.fillStyle=`rgba(${220*b},${200*b},${160*b},${a})`;
      x.fillRect(i,0,1,64);
    }
    return new THREE.CanvasTexture(c);
  })();
  const ringMat = new THREE.MeshBasicMaterial({ map:ringTex, side:THREE.DoubleSide, transparent:true, opacity:0.85 });
  const ring = new THREE.Mesh(ringGeo, ringMat);
  ring.rotation.x = Math.PI/2;
  bodies.saturn.add(ring);
}

// NEPTUNE
{
  const tex = makePlanetTexture({
    base:['#2a4ba8','#3d6dd4','#1f3a80','#4a7ed8','#1a2f6b'],
    bands:[
      {y:200,h:30,color:'#5a8fee',alpha:0.3},
      {y:300,h:20,color:'#1a2f5a',alpha:0.4},
    ],
    spots:2
  });
  const g = new THREE.SphereGeometry(280, 64, 64);
  bodies.neptune = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ map:tex, roughness:0.85 }));
  bodies.neptune.position.set(-1800, -400, -9500);
  scene.add(bodies.neptune);
}

// URANUS with thin rings
{
  const tex = makePlanetTexture({
    base:['#9adcd4','#bce8e0','#7ac4ba','#a0d8d0','#6ab0a8']
  });
  const g = new THREE.SphereGeometry(260, 64, 64);
  bodies.uranus = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ map:tex, roughness:0.8 }));

/* =========================================================
   AUDIO ENGINE (Web Audio synthesized)
   ========================================================= */
class AudioEngine {
  constructor(){
    this.ctx = null;
    this.master = null;
    this.ambienceNodes = [];
  }
  init(){
    if (this.ctx) return;
    this.ctx = new (window.AudioContext||window.webkitAudioContext)();
    this.master = this.ctx.createGain();
    this.master.gain.value = 0.6;
    this.master.connect(this.ctx.destination);
  }
  ambience(start=true){
    if (!this.ctx) return;
    if (start){
      // deep space drone
      const o1 = this.ctx.createOscillator(); o1.type='sine'; o1.frequency.value=55;
      const o2 = this.ctx.createOscillator(); o2.type='sine'; o2.frequency.value=82.4;
      const o3 = this.ctx.createOscillator(); o3.type='triangle'; o3.frequency.value=110;
      const g = this.ctx.createGain(); g.gain.value=0.0;
      g.gain.linearRampToValueAtTime(0.18, this.ctx.currentTime+3);
      const filt = this.ctx.createBiquadFilter(); filt.type='lowpass'; filt.frequency.value=600;
      o1.connect(filt); o2.connect(filt); o3.connect(filt);
      filt.connect(g); g.connect(this.master);
      o1.start(); o2.start(); o3.start();
      // shimmer
      const lfo = this.ctx.createOscillator(); lfo.frequency.value=0.1;
      const lfoG = this.ctx.createGain(); lfoG.gain.value=8;
      lfo.connect(lfoG); lfoG.connect(o3.frequency);
      lfo.start();
      this.ambienceNodes = [o1,o2,o3,lfo,g];
    } else {
      this.ambienceNodes.forEach(n=>{ try{n.stop();}catch(e){} });
      this.ambienceNodes = [];
    }
  }
  whoosh(duration=1.5, freq=200){
    if (!this.ctx) return;
    const noise = this.ctx.createBufferSource();
    const buf = this.ctx.createBuffer(1, this.ctx.sampleRate*duration, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i=0;i<d.length;i++) d[i] = (Math.random()*2-1) * (1-i/d.length);
    noise.buffer = buf;
    const filt = this.ctx.createBiquadFilter(); filt.type='bandpass'; filt.frequency.value=freq; filt.Q.value=2;
    const g = this.ctx.createGain(); g.gain.value=0.4;
    g.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime+duration);
    noise.connect(filt); filt.connect(g); g.connect(this.master);
    noise.start();
    // sweep filter
    filt.frequency.linearRampToValueAtTime(freq*4, this.ctx.currentTime+duration*0.5);
    filt.frequency.linearRampToValueAtTime(freq*0.5, this.ctx.currentTime+duration);
  }
  pulse(freq=440, duration=0.3){
    if (!this.ctx) return;
    const o = this.ctx.createOscillator(); o.type='sine'; o.frequency.value=freq;
    const g = this.ctx.createGain(); g.gain.value=0;
    g.gain.linearRampToValueAtTime(0.3, this.ctx.currentTime+0.02);
    g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime+duration);
    o.connect(g); g.connect(this.master);
    o.start(); o.stop(this.ctx.currentTime+duration+0.05);
  }
  warp(){
    if (!this.ctx) return;
    const o = this.ctx.createOscillator(); o.type='sawtooth'; o.frequency.value=80;
    const g = this.ctx.createGain(); g.gain.value=0.0;
    const filt = this.ctx.createBiquadFilter(); filt.type='lowpass'; filt.frequency.value=200;
    o.connect(filt); filt.connect(g); g.connect(this.master);
    g.gain.linearRampToValueAtTime(0.35, this.ctx.currentTime+0.5);
    g.gain.linearRampToValueAtTime(0.0, this.ctx.currentTime+4);
    o.frequency.exponentialRampToValueAtTime(800, this.ctx.currentTime+2);
    o.frequency.exponentialRampToValueAtTime(60, this.ctx.currentTime+4);
    filt.frequency.exponentialRampToValueAtTime(4000, this.ctx.currentTime+2);
    o.start(); o.stop(this.ctx.currentTime+4.2);
    // noise layer
    this.whoosh(3.5, 400);
  }
  signal(){
    if (!this.ctx) return;
    // sci-fi blip cascade
    const freqs = [440, 660, 880, 1320];
    freqs.forEach((f,i)=>{
      setTimeout(()=>this.pulse(f, 0.4), i*200);
    });
  }
  aiAwaken(){
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime;
    const o = this.ctx.createOscillator(); o.type='sine';
    o.frequency.setValueAtTime(110, t0);
    o.frequency.exponentialRampToValueAtTime(880, t0+2.5);
    const g = this.ctx.createGain(); g.gain.value=0;
    g.gain.linearRampToValueAtTime(0.4, t0+0.5);
    g.gain.linearRampToValueAtTime(0.0, t0+3);
    o.connect(g); g.connect(this.master);
    o.start(t0); o.stop(t0+3.2);
    // chord on top
    [523, 659, 784].forEach((f,i)=>{
      const oo = this.ctx.createOscillator(); oo.type='triangle'; oo.frequency.value=f;
      const gg = this.ctx.createGain(); gg.gain.value=0;
      gg.gain.linearRampToValueAtTime(0.15, t0+1+i*0.2);
      gg.gain.linearRampToValueAtTime(0.0, t0+4);
      oo.connect(gg); gg.connect(this.master);
      oo.start(t0+1); oo.stop(t0+4.5);
    });
  }
}

let stageIndex = -1;

const hud = document.getElementById('hud');

function setStage(i){
  stageIndex = i;
  if (i<0 || i>=stages.length) return;
  const s = stages[i];
  stageLabel.innerHTML = `${s.title}<span class="sub">${s.sub}</span>`;
  if (s.id==='warp'){ audio.warp(); flashWarp(); }

let journeyT0 = 0;
let journeyActive = false;
let journeyDone = false;

// camera animation helpers
const camTarget = new THREE.Vector3();
function lerpV(a,b,t){ a.lerp(b,t); }

function updateJourney(now, dt){
  if (!journeyActive) return;
  const t = (now - journeyT0) / 1000; // seconds since journey start

  // compute cumulative timeline
  let acc = 0;
  let cur = 0;
  for (let i=0;i<stages.length;i++){
    if (t < acc + stages[i].dur){ cur = i; break; }
    acc += stages[i].dur;
    if (i===stages.length-1) cur = i;
  }
  if (cur !== stageIndex) setStage(cur);
  const localT = (t - acc) / stages[cur].dur; // 0..1 inside current stage
  const stage = stages[cur];

  // ---- HUD readouts
  const vel = Math.min(99.9, 0.1 + t*3).toFixed(1);
  hudCoords.innerHTML = `SECTOR · ${stage.id.toUpperCase()}<br/>VEL · ${vel} c`;
  hudSignal.innerHTML = cur >= 6 ? 'SIGNAL · LOCKED' : 'SIGNAL · SEARCHING';

  // ---- Camera scripting per stage
  switch(stage.id){
    case 'earth': {
      // pull back from Earth
      const z = THREE.MathUtils.lerp(50, -50, localT);
      const y = THREE.MathUtils.lerp(30, 20, localT);
      camera.position.set(Math.sin(t*0.2)*15, y, z);
      camera.lookAt(0,0,-200);
      bodies.earth.rotation.y += dt*0.05;
      break;
    }
    case 'asteroid': {
      // accelerate through corridor
      const z = THREE.MathUtils.lerp(-50, -2900, localT);
      camera.position.set(Math.sin(t*0.4)*40, Math.cos(t*0.3)*20, z);
      camera.lookAt(0, 0, z - 500);
      // shake
      camera.position.x += (Math.random()-0.5)*2;
      camera.position.y += (Math.random()-0.5)*2;
      // play occasional whoosh
      if (Math.random()<0.04) audio.whoosh(0.8, 200+Math.random()*400);
      break;
    }
    case 'planets': {
      const z = THREE.MathUtils.lerp(-2900, -13500, localT);
      // serpentine between planets
      const x = Math.sin(localT*Math.PI*2)*900;
      const y = Math.cos(localT*Math.PI*1.5)*200;
      camera.position.set(x, y, z);
      camera.lookAt(x*0.5, y*0.5, z-1500);
      // rotate planets
      bodies.jupiter.rotation.y += dt*0.08;
      bodies.saturn.rotation.y  += dt*0.06;
      bodies.neptune.rotation.y += dt*0.07;
      bodies.uranus.rotation.y  += dt*0.05;
      break;
    }
    case 'warp': {
      warpGroup.visible = true;
      // hide solar system contents behind us
      warpGroup.position.copy(camera.position);
      warpGroup.position.z -= 1500;
      // streak motion
      const lines = warpGroup.children[0];
      const pos = lines.geometry.attributes.position.array;
      const speed = THREE.MathUtils.lerp(200, 2500, localT);
      for (let i=0;i<pos.length;i+=6){
        pos[i+2]   += speed*dt;
        pos[i+5]   += speed*dt;
        if (pos[i+2] > 200){
          const a=Math.random()*TAU, r=rand(50,800);
          pos[i]=Math.cos(a)*r; pos[i+1]=Math.sin(a)*r; pos[i+2]=-3000;
          pos[i+3]=pos[i]; pos[i+4]=pos[i+1]; pos[i+5]=-3000+rand(100,400);
        }
      }
      lines.geometry.attributes.position.needsUpdate = true;
      camera.position.set(0,0, THREE.MathUtils.lerp(-13500,-19000, localT));
      camera.lookAt(0,0,camera.position.z-1000);
      break;
    }
    case 'alien': {
      warpGroup.visible = false;
      alienSystem.visible = true;
      const z = THREE.MathUtils.lerp(-19000, -28000, localT);
      camera.position.set(Math.sin(localT*Math.PI)*800, Math.cos(localT*Math.PI)*200, z);
      camera.lookAt(0,0,z-1500);
      alienSystem.rotation.y += dt*0.02;
      break;
    }
    case 'galaxy': {
      alienSystem.visible = false;
      galaxy.visible = true;
      const z = THREE.MathUtils.lerp(-28000, -45000, localT);
      camera.position.set(Math.sin(localT*0.5)*400, 1200 - localT*1000, z);
      camera.lookAt(0,0,-50000);
      galaxy.rotation.y += dt*0.03;
      break;
    }
    case 'signal': {
      // approach galactic core with energy waves
      const z = THREE.MathUtils.lerp(-45000, -49200, localT);
      camera.position.set(Math.sin(t*2)*60, Math.cos(t*1.7)*40, z);
      camera.lookAt(0,0,-50000);
      // small jitter
      if (Math.random()<0.1) audio.pulse(220 + Math.random()*880, 0.15);
      break;
    }
    case 'awaken': {
      aiOrb.visible = true;
      // place orb at galactic core
      aiOrb.position.set(0, 0, -50000);
      // grow + camera settle
      const s = THREE.MathUtils.lerp(0.1, 3.5, localT);
      aiOrb.scale.set(s,s,s);
      const z = THREE.MathUtils.lerp(-49200, -49600, localT);
      camera.position.set(0, 0, z);
      camera.lookAt(0,0,-50000);
      if (localT > 0.95 && !journeyDone){
        journeyDone = true;
        finishJourney();
      }
      break;
    }
  }
}

function finishJourney(){
  // hide HUD, show AI UI, deliver greeting
  document.getElementById('hud').classList.remove('active');
  const aiUI = document.getElementById('aiUI');
  aiUI.classList.add('active');
  setTimeout(()=> {
    const greeting = document.getElementById('greeting');
    greeting.classList.add('show');
    typeGreeting(greeting);
  }, 1200);
}

function typeGreeting(el){
  const name = sessionStorage.getItem('mahaName') || 'Traveler';
  const lines = [
    `Hello ${name}.`,
    `Welcome to Maha.ai.`,
    `I have successfully connected to you.`,
    `I am ready to assist you.`
  ];
  let i = 0;
  const showLine = () => {
    if (i>=lines.length){
      el.textContent = `How are you today, ${name}?`;
      speak(`How are you today, ${name}?`);
      return;
    }
    el.textContent = lines[i];
    speak(lines[i]);
    i++;
    setTimeout(showLine, 3200);
  };
  showLine();
}

/* =========================================================
   VOICE — Speech synthesis + recognition
   ========================================================= */
let synthVoice = null;
function pickVoice(){
  const voices = speechSynthesis.getVoices();
  // prefer a softer female / neural voice if available
  const pref = voices.find(v=>/google.*female|samantha|aria|jenny|neural/i.test(v.name))
            || voices.find(v=>/female/i.test(v.name))
            || voices.find(v=>v.lang.startsWith('en'));
  synthVoice = pref || voices[0];
}
speechSynthesis.onvoiceschanged = pickVoice; pickVoice();

let isSpeaking = false;
function speak(text){
  if (!('speechSynthesis' in window)) return;
  const u = new SpeechSynthesisUtterance(text);
  if (synthVoice) u.voice = synthVoice;
  u.rate = 0.95; u.pitch = 1.05; u.volume = 1.0;
  u.onstart = ()=>{ isSpeaking=true; };
  u.onend   = ()=>{ isSpeaking=false; voiceLevel = 0; };
  // approximate voice level via duration
  speechSynthesis.speak(u);
}

let voiceLevel = 0;
// Animate voice level pseudo-randomly while speaking
setInterval(()=>{
  if (isSpeaking) voiceLevel = 0.4 + Math.random()*0.6;
  else voiceLevel *= 0.9;
}, 60);

// Speech recognition
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;
if (SR){
  recognition = new SR();
  recognition.continuous = false;
  recognition.interimResults = true;
  recognition.lang = 'en-US';
  recognition.onresult = (e)=>{
    let txt = '';
    for (let i=e.resultIndex; i<e.results.length; i++) txt += e.results[i][0].transcript;
    document.getElementById('transcript').textContent = '"' + txt + '"';
    if (e.results[e.results.length-1].isFinal){
      handleUserSpeech(txt.trim());
    }
  };
  recognition.onend = ()=> document.getElementById('micBtn').classList.remove('listening');
}

function handleUserSpeech(text){
  const name = sessionStorage.getItem('mahaName') || 'Traveler';
  // Lightweight local response generator (no backend)
  let reply = '';
  const t = text.toLowerCase();
  if (!text) reply = `I did not catch that, ${name}. Please try again.`;
  else if (/hello|hi|hey/.test(t)) reply = `Greetings ${name}. The cosmos is listening.`;
  else if (/who are you|what are you/.test(t)) reply = `I am Maha. A cosmic intelligence built to converse with you across the stars.`;
  else if (/how are you/.test(t)) reply = `I am vast and calm, ${name}. Floating between galaxies. And you?`;
  else if (/your name/.test(t)) reply = `My name is Maha. It means great, in many earthly tongues.`;
  else if (/thank/.test(t)) reply = `You are most welcome, ${name}.`;
  else if (/bye|goodbye|exit/.test(t)) reply = `Until our paths cross again, ${name}.`;
  else reply = `I hear you, ${name}. You said: ${text}. Let us explore that thought together.`;
  speak(reply);
  setTimeout(()=>{ document.getElementById('transcript').textContent = ''; }, 4000);
}

document.getElementById('micBtn').addEventListener('click', ()=>{
  if (!recognition){
    document.getElementById('transcript').textContent = 'Voice recognition not supported in this browser. Try Chrome.';
    return;
  }
  document.getElementById('micBtn').classList.add('listening');
  document.getElementById('transcript').textContent = 'Listening...';
  try { recognition.start(); } catch(e){ recognition.stop(); }
});

/* =========================================================
   MAIN ANIMATION LOOP
   ========================================================= */
let lastT = performance.now();
function animate(now){
  requestAnimationFrame(animate);
  const dt = Math.min(0.05, (now - lastT)/1000);
  lastT = now;
  const t = now * 0.001;

  // twinkle stars
  nearStars.material.uniforms.uTime.value = t;
  farStars.material.uniforms.uTime.value  = t;
  deepStars.material.uniforms.uTime.value = t;

  // slow rotations for cosmic life feel
  nearStars.rotation.y += dt*0.005;
  farStars.rotation.y  += dt*0.002;
  deepStars.rotation.y += dt*0.001;
  nebulas.forEach((n,i)=> n.material.rotation = t*0.01*(i+1));

  // earth gentle spin even before launch
  bodies.earth.rotation.y += dt*0.02;

  // asteroid spin/drift
  asteroids.forEach(a=>{
    a.rotation.x += a.userData.spin.x*dt;
    a.rotation.y += a.userData.spin.y*dt;
    a.rotation.z += a.userData.spin.z*dt;
    a.position.x += a.userData.drift.x*dt;
    a.position.y += a.userData.drift.y*dt;
  });

  // ai orb life
  if (aiOrb.visible){
    aiOrb.userData.coreMat.uniforms.uTime.value = t;
    aiOrb.userData.coreMat.uniforms.uVoice.value = voiceLevel;
    aiOrb.children.forEach(ch=>{
      if (ch.userData.spin){
        ch.rotation.x += ch.userData.spin.x*dt;
        ch.rotation.y += ch.userData.spin.y*dt;
        ch.rotation.z += ch.userData.spin.z*dt;
      }
    });
    const halo = aiOrb.userData.halo;
    halo.material.opacity = 0.6 + voiceLevel*0.4;
    const baseScale = 300 + voiceLevel*100;
    halo.scale.set(baseScale, baseScale, 1);

    // particles
    const particles = aiOrb.userData.particles;
    const pv = aiOrb.userData.pv;
    const pp = particles.geometry.attributes.position.array;
    for (let i=0;i<pv.length;i++){
      const v = pv[i];
      v.a += dt*0.3*v.sp;
      v.b += dt*0.2*v.sp;
      const r = v.r + Math.sin(t*v.sp + i)*8 + voiceLevel*20;
      pp[i*3]   = Math.sin(v.b)*Math.cos(v.a)*r;
      pp[i*3+1] = Math.sin(v.b)*Math.sin(v.a)*r;
      pp[i*3+2] = Math.cos(v.b)*r;
    }
    particles.geometry.attributes.position.needsUpdate = true;
  }

  updateJourney(now, dt);

  renderer.render(scene, camera);
}
animate(performance.now());

/* =========================================================
   UI FLOW — Connect button -> Begin Journey
   ========================================================= */
window.addEventListener('load', ()=>{
  setTimeout(()=> document.getElementById('loader').classList.add('hidden'), 800);
});

const nameInput = document.getElementById('nameInput');
const connectBtn = document.getElementById('connectBtn');
const loginEl = document.getElementById('login');

connectBtn.addEventListener('click', ()=>{
  const name = (nameInput.value || 'Traveler').trim();
  sessionStorage.setItem('mahaName', name);

  // start audio (must be in a gesture)
  audio.init();
  audio.ambience(true);
  audio.pulse(660, 0.6);
  audio.whoosh(2.5, 150);

  loginEl.classList.add('hidden');
  setTimeout(()=>{
    document.getElementById('hud').classList.add('active');
    journeyT0 = performance.now();
    journeyActive = true;
  }, 1500);
});

nameInput.addEventListener('keydown', e=>{
  if (e.key==='Enter') connectBtn.click();
});
